[workspace]
members = ["mock-aurora"]

[package]
name = "scribe"
version = "0.1.0"
description = "Flight strip manager for IVAO Aurora"
authors = ["Jules Chenelat"]
edition = "2021"

[lib]
name = "scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "io-util",
    "macros",
] }
tracing = "0.1"

[dev-dependencies]
mock-aurora = { path = "mock-aurora" }
